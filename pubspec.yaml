name: walleta
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  provider: ^6.1.5+1
  stacked: ^3.5.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.3.0
  http: ^1.6.0
  local_auth: ^3.0.1
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.0.0
  light_sensor: ^3.0.2
  firebase_core: ^4.10.0
  intl: ^0.20.2
  auto_route: ^11.1.0
  fl_chart: ^1.2.0
  device_info_plus: ^13.2.0
  permission_handler: ^12.0.3
  timeago: ^3.7.1
  image_picker: ^1.2.3
  dio: ^5.10.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

# ── App Icon Config ───────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: 'launcher_icon'
  ios: 'app_icon'
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_foreground: "assets/icons/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_round: "assets/icons/logo.png"

  # ── Web (optional) ────────────────────────────────────────────────────────
  web:
    generate: true
    image_path: "assets/icons/logo.png"
    background_color: "##FFFFFF"
    theme_color: "##FFFFFF"

  # ── Windows (optional) ────────────────────────────────────────────────────
  windows:
    generate: true
    image_path: "assets/icons/logo.png"
    icon_size: 48Y